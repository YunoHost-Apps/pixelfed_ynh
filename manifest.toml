packaging_format = 2

id = "pixelfed"
name = "Pixelfed"
description.en = "Decentralized photo sharing social media platform"
description.fr = "Plateforme de partage de photos décentralisée"

version = "0.12.9~ynh3"

maintainers = ["yalh76", "Lapineige"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://pixelfed.org/"
admindoc = "https://docs.pixelfed.org/running-pixelfed/administration.html"
userdoc = "https://docs.pixelfed.org/"
code = "https://github.com/pixelfed/pixelfed"
cpe = "cpe:2.3:a:pixelfed:pixelfed"
fund = "https://www.patreon.com/dansup"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "500M"
ram.build = "1000M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["de", "en", "es", "fr", "it", "nl", "pt"]
    default = "fr"

[resources]
        [resources.sources.main]
        url = "https://github.com/pixelfed/pixelfed/archive/1a49fb5873fb8db9f2f34e194e46e51362531d9d.zip"
        sha256 = "2eaa5ac683f3712f4fb013f60dc5c06a68c3feb51859449861d8cc2a4939e028"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "postgresql, libgd3, jpegoptim, optipng, pngquant, ffmpeg, imagemagick, php8.5-redis, php8.5-bcmath, php8.5-cli, php8.5-ctype, php8.5-curl, php8.5-exif, php8.5-gd, php8.5-iconv, php8.5-intl, php8.5-mbstring, php8.5-tokenizer, php8.5-xml, php8.5-zip, php8.5-pdo, php8.5-pgsql, php8.5-fileinfo, php8.5-imagick, redis-server"

    [resources.database]
    type = "postgresql"

    [resources.composer]
    version = "2.10.2"
